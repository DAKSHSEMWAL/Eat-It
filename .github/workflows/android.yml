name: Compose Android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDemoDebug :app:testDemoDebugUnitTest :app:lintDemoDebug :designsystem:lintDebug :designsystem:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-reports
          path: |
            android/app/build/reports
            android/designsystem/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: eat-it-demo
          path: android/app/build/outputs/apk/demo/debug/*.apk
